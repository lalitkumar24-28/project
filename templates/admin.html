<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | CineVault</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v={{ range(1, 1000) | random }}">
</head>
<body>

<div class="layout-wrapper">
    <header>
        <a href="{{ url_for('index') }}" class="logo-container">
            <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="22" fill="#0b1812" stroke="#98ca3f" stroke-width="6"/>
                <path d="M38 32 L18 50 L38 68" stroke="#98ca3f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M62 32 L82 50 L62 68" stroke="#00ffd2" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="logo">Cine<span>Vault</span> <span style="font-size: 14px; font-weight: 500; color: var(--accent-cyan);">(Admin)</span></span>
        </a>
        <div class="nav-actions">
            <a href="{{ url_for('index') }}" class="btn-secondary">View Site</a>
            <a href="{{ url_for('logout') }}" class="btn-primary" style="background: linear-gradient(135deg, #ff0055 0%, #ff5500 100%); color: white; box-shadow: 0 4px 15px rgba(255, 0, 85, 0.25);">Logout</a>
        </div>
    </header>

    <div class="section-title">⚙️ Add New Movie ⚙️</div>

    <div class="form-container">
        <form action="{{ url_for('add_movie') }}" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="title">Movie Title</label>
                <input type="text" id="title" name="title" class="form-control" placeholder="e.g., Inception" required>
            </div>

            <div class="form-group">
                <label for="year">Release Year</label>
                <input type="number" id="year" name="year" class="form-control" placeholder="e.g., 2026" required>
            </div>

            <div class="form-group">
                <label for="genre">Genre</label>
                <input type="text" id="genre" name="genre" class="form-control" placeholder="e.g., Action, Sci-Fi, Thriller" required>
            </div>

            <div class="form-group">
                <label for="description">Synopsis / Story</label>
                <textarea id="description" name="description" class="form-control" placeholder="Brief description of the movie plot..." rows="4"></textarea>
            </div>

            <div class="form-group">
                <label>Movie Poster</label>
                <input type="file" name="poster" class="form-control" accept="image/*" style="margin-bottom: 10px;">
                <div style="text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 10px;">— OR —</div>
                <input type="url" name="poster_url" class="form-control" placeholder="Provide image URL (e.g., https://site.com/image.jpg)">
            </div>

            <div class="form-group">
                <label>Upload Video File</label>
                <input type="file" name="video" class="form-control" accept="video/mp4,video/x-mkv,video/*">
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label>Select Available Download Qualities</label>
                <div class="checkbox-group-container">
                    <label><input type="checkbox" name="qualities" value="4K" checked> 4K UHD</label>
                    <label><input type="checkbox" name="qualities" value="1080p" checked> 1080p HD</label>
                    <label><input type="checkbox" name="qualities" value="720p" checked> 720p HD</label>
                    <label><input type="checkbox" name="qualities" value="480p"> 480p SD</label>
                    <label><input type="checkbox" name="qualities" value="360p"> 360p</label>
                    <label><input type="checkbox" name="qualities" value="144p"> 144p</label>
                </div>
            </div>

            <div style="margin-top: 30px; text-align: center;">
                <button type="submit" class="btn-primary" style="font-size: 16px; padding: 14px 40px; width: 100%;">Publish Movie</button>
            </div>
        </form>
    </div>

    <div class="section-title" style="margin-top: 50px;">🎬 Manage Movies 🎬</div>
    <div class="form-container" style="max-width: 800px; padding: 20px;">
        {% if movies %}
            <table style="width: 100%; text-align: left; border-collapse: collapse;">
                <thead>
                    <tr style="border-bottom: 1px solid #333; color: var(--accent-green);">
                        <th style="padding: 10px;">Title</th>
                        <th style="padding: 10px;">Year</th>
                        <th style="padding: 10px;">Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for movie in movies %}
                    <tr style="border-bottom: 1px solid #222;">
                        <td style="padding: 10px;">{{ movie.title }}</td>
                        <td style="padding: 10px;">{{ movie.release_year }}</td>
                        <td style="padding: 10px;">
                            <form action="{{ url_for('delete_movie', id=movie.id) }}" method="POST" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this movie?');">
                                <button type="submit" class="btn-primary" style="background: linear-gradient(135deg, #ff0055 0%, #ff5500 100%); padding: 5px 15px; font-size: 14px;">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p style="text-align: center; color: var(--text-muted);">No movies uploaded yet.</p>
        {% endif %}
    </div>

    <footer>
        <p>&copy; 2026 CineVault Admin Panel</p>
    </footer>
</div>

<div class="custom-cursor"></div>
<div class="custom-cursor-follower"></div>

<script>
    // Custom Cursor Logic
    const cursor = document.querySelector('.custom-cursor');
    const follower = document.querySelector('.custom-cursor-follower');
    
    document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
        setTimeout(() => {
            follower.style.left = e.clientX + 'px';
            follower.style.top = e.clientY + 'px';
        }, 50);
    });

    const hoverElements = document.querySelectorAll('a, button, input, textarea, label, input[type="checkbox"]');
    hoverElements.forEach(el => {
        el.addEventListener('mouseenter', () => follower.classList.add('active'));
        el.addEventListener('mouseleave', () => follower.classList.remove('active'));
    });
</script>
</body>
</html>
