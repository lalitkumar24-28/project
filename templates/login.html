<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CineVault</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v={{ range(1, 1000) | random }}">
</head>
<body>

<div class="layout-wrapper" style="justify-content: center;">
    <header style="position: relative; border-bottom: none; background: transparent;">
        <a href="{{ url_for('index') }}" class="logo-container">
            <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="22" fill="#0b1812" stroke="#98ca3f" stroke-width="6"/>
                <path d="M38 32 L18 50 L38 68" stroke="#98ca3f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M62 32 L82 50 L62 68" stroke="#00ffd2" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="logo">Cine<span>Vault</span></span>
        </a>
    </header>

    <div class="section-title" style="margin-top: 10px;">🔒 Admin Panel 🔒</div>

    <div class="form-container">
        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="admin" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 15px; padding: 14px; font-size: 16px;">Sign In</button>
        </form>
        
        <div style="text-align: center; margin-top: 25px;">
            <a href="{{ url_for('index') }}" class="btn-secondary" style="font-size: 13px; padding: 8px 20px;">Return to Home</a>
        </div>
    </div>

    <footer style="margin-top: auto; background: transparent; border-top: none;">
        <p>&copy; 2026 CineVault Admin Panel</p>
    </footer>
</div>

<div class="custom-cursor"></div>
<div class="custom-cursor-follower"></div>

<script>
    // Custom Cursor Logic
    const cursor = document.querySelector('.custom-cursor');
    const follower = document.querySelector('.custom-cursor-follower');
    
    document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
        setTimeout(() => {
            follower.style.left = e.clientX + 'px';
            follower.style.top = e.clientY + 'px';
        }, 50);
    });

    const hoverElements = document.querySelectorAll('a, button, input');
    hoverElements.forEach(el => {
        el.addEventListener('mouseenter', () => follower.classList.add('active'));
        el.addEventListener('mouseleave', () => follower.classList.remove('active'));
    });
</script>
</body>
</html>
